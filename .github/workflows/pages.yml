# Publica la app en GitHub Pages cada vez que cambia la rama main.
# Requisito: repositorio público (o cuenta con Pages privado). El workflow intenta activar Pages solo;
# si falla, en el repositorio: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # crea el sitio de Pages si aún no existe (el repositorio debe ser público en cuentas gratuitas)
      - name: Versionar la caché del service worker con el commit
        run: sed -i "s/talkagain-v[0-9.]*'/talkagain-${GITHUB_SHA::8}'/" sw.js && grep -n "const VERSION" sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
